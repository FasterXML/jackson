# CLA nudge (reusable workflow)
#
# Posts a CLA request on open PRs labeled `cla-needed`, then a reminder every
# `interval-days` until the label is removed or swapped for `cla-received`.
#
# Each repo calls this from a small caller workflow (`.github/workflows/cla-nudge.yml`
# in that repo). Every run scans all open `cla-needed` PRs of the calling repo,
# so the trigger only decides *when* we look, never *which* PR.
#
# Security: the script is checked out from a pinned FasterXML/jackson commit.
# It reads labels / comments / reviews / events and posts comments through the API.
# Callers grant contents: read, issues: write, and pull-requests: write to their
# GITHUB_TOKEN. Update the source ref below whenever the script changes.
name: CLA nudge (reusable)

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Only log what would be posted; post nothing"
        type: boolean
        default: false
      simulate-now:
        description: "Dry run only: ISO-8601 timestamp to treat as 'now'"
        type: string
        default: ''
      interval-days:
        description: "Days between the request and each reminder; each caller must set this"
        type: number
        required: true
      max-reminders:
        description: "Stop after this many reminders per PR; 0 = no limit"
        type: number
        default: 0
      skip-labeled-before:
        description: "UTC calendar date (YYYY-MM-DD); ignore PRs first labeled before it ('' = no cutoff)"
        type: string
        default: ''

permissions: {}

jobs:
  nudge:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: cla-nudge-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Load trusted CLA nudge script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: FasterXML/jackson
          # This immutable commit contains the script used by this workflow.
          ref: 6d8cd183e578032c7cc627282071af5cb4fda18b
          path: cla-nudge-source
          sparse-checkout: .github/scripts/cla-nudge.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Post CLA requests and reminders
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          SIMULATE_NOW: ${{ inputs.simulate-now }}
          INTERVAL_DAYS: ${{ inputs.interval-days }}
          MAX_REMINDERS: ${{ inputs.max-reminders }}
          SKIP_LABELED_BEFORE: ${{ inputs.skip-labeled-before }}
        with:
          script: |
            const claNudge = require('./cla-nudge-source/.github/scripts/cla-nudge.cjs');
            await claNudge({ github, context, core });
